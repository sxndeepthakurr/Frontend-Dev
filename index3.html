<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Store | Product Listing</title>

  <!-- ✅ Bootstrap CSS CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >

  <style>
    /* Custom Styles */
    body {
      background-color: #f8f9fa;
    }

    .product-card {
      transition: all 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    .product-card img {
      height: 200px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- ✅ Header -->
  <header class="bg-dark text-white text-center py-4 mb-4">
    <h1 class="fw-bold">Our Products</h1>
  </header>

  <!-- ✅ Product Grid -->
  <div class="container">
    <div class="row g-4">

      <!-- Product 1 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/id/1010/400/300" class="card-img-top" alt="Product 1">
          <div class="card-body text-center">
            <h5 class="card-title">Classic Headphones</h5>
            <p class="text-muted mb-2">$59.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/id/1020/400/300" class="card-img-top" alt="Product 2">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Speaker</h5>
            <p class="text-muted mb-2">$89.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/id/1030/400/300" class="card-img-top" alt="Product 3">
          <div class="card-body text-center">
            <h5 class="card-title">Smart Watch</h5>
            <p class="text-muted mb-2">$129.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/id/1040/400/300" class="card-img-top" alt="Product 4">
          <div class="card-body text-center">
            <h5 class="card-title">Fitness Tracker</h5>
            <p class="text-muted mb-2">$49.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ✅ Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous">
  </script>
</body>
</html>
