<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Report Card</title>
</head>
<body>

  <h1>Greenwood High School</h1>

  <hr>

  <table border="1" cellspacing="0" cellpadding="8" width="60%">
    <caption><strong>Student Report Card</strong></caption>
    
    <thead>
      <tr>
        <th rowspan="2" title="Serial Number of the Subject">S.No</th>
        <th rowspan="2" title="Name of the Subject">Subject</th>
        <th colspan="2" title="Marks obtained and Maximum Marks">Marks</th>
      </tr>
      <tr>
        <th title="Marks obtained by student">Obtained</th>
        <th title="Maximum marks for the subject">Max</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>1</td>
        <td>Mathematics</td>
        <td>85</td>
        <td>100</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Science</td>
        <td>78</td>
        <td>100</td>
      </tr>
      <tr>
        <td>3</td>
        <td>English</td>
        <td>92</td>
        <td>100</td>
      </tr>
      <tr>
        <td>4</td>
        <td>History</td>
        <td>88</td>
        <td>100</td>
      </tr>
      <tr>
        <td>5</td>
        <td>Computer Science</td>
        <td>95</td>
        <td>100</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td colspan="2" title="Total Marks Obtained">Total</td>
        <td>438</td>
        <td>500</td>
      </tr>
      <tr>
        <td colspan="2" title="Overall Percentage of student">Percentage</td>
        <td colspan="2">87.6%</td>
      </tr>
    </tfoot>
  </table>

  <hr>

  <footer>
    <p>Report generated by Greenwood High School | &copy; 2025</p>
  </footer>

</body>
</html>
