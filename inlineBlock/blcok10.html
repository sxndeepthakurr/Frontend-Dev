<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Preferences Selection</title>
</head>
<body>

  <header>
    <h1>Travel Preferences Selection</h1>
  </header>

  <hr>

  <form>

    <label for="country">Select Country:</label><br>
    <select id="country" name="country">
      <option value="india" selected>India</option>
      <option value="france">France</option>
      <option value="japan">Japan</option>
      <option value="usa">USA</option>
    </select>
    <br><br>

    <label for="state">Select State:</label><br>
    <select id="state" name="state">
      <option value="maharashtra" selected>Maharashtra</option>
      <option value="karnataka">Karnataka</option>
      <option value="gujarat">Gujarat</option>
      <option value="delhi">Delhi</option>
    </select>
    <br><br>

    <label for="city">Select City:</label><br>
    <select id="city" name="city">
      <option value="mumbai" selected>Mumbai</option>
      <option value="pune">Pune</option>
      <option value="bangalore">Bangalore</option>
      <option value="delhi">Delhi</option>
    </select>
    <br><br>

    <label for="tourist">Favorite Tourist Place:</label><br>
    <select id="tourist" name="tourist">
      <option value="gateway" selected>Gateway of India</option>
      <option value="tajmahal">Taj Mahal</option>
      <option value="eiffel">Eiffel Tower</option>
      <option value="mtfuji">Mount Fuji</option>
    </select>

  </form>

  <hr>

  <p>
    You have selected <strong>India</strong> as your country, <strong>Maharashtra</strong> as your state, <strong>Mumbai</strong> as your city, and your favorite tourist place is <strong>Gateway of India</strong>.
  </p>

  <hr>

  <footer>
    <p>&copy; 2025 Travel Explorer. All Rights Reserved.</p>
  </footer>

</body>
</html>
