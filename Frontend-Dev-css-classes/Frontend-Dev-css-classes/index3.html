<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Image Showcase Gallery</h1>

  <div class="gallery">
    <figure class="image-item">
      <div class="img-container">
        <img src="https://picsum.photos/id/1015/400/250" alt="Mountain Landscape">
        <div class="overlay"></div>
      </div>
      <figcaption>Peaceful Mountain Landscape</figcaption>
    </figure>

    <figure class="image-item">
      <div class="img-container">
        <img src="https://picsum.photos/id/1025/400/250" alt="Dog Portrait">
        <div class="overlay"></div>
      </div>
      <figcaption>Golden Retriever Portrait</figcaption>
    </figure>

    <figure class="image-item">
      <div class="img-container">
        <img src="https://picsum.photos/id/1035/400/250" alt="Beach Sunset">
        <div class="overlay"></div>
      </div>
      <figcaption>Sunset at the Beach</figcaption>
    </figure>

    <figure class="image-item">
      <div class="img-container">
        <img src="https://picsum.photos/id/1045/400/250" alt="City Skyline">
        <div class="overlay"></div>
      </div>
      <figcaption>Modern City Skyline</figcaption>
    </figure>

    <figure class="image-item">
      <div class="img-container">
        <img src="https://picsum.photos/id/1055/400/250" alt="Forest Path">
        <div class="overlay"></div>
      </div>
      <figcaption>Forest Walking Path</figcaption>
    </figure>

    <figure class="image-item">
      <div class="img-container">
        <img src="https://picsum.photos/id/1065/400/250" alt="Desert Dunes">
        <div class="overlay"></div>
      </div>
      <figcaption>Golden Desert Dunes</figcaption>
    </figure>
  </div>
</body>
</html>
