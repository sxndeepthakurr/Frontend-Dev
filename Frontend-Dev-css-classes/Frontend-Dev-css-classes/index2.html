<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltip Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Tooltip Demonstration</h1>

  <div class="container">
    <div class="tooltip">
      <span class="icon">💡</span>
      <span class="tooltip-text">This is a light bulb icon tooltip.</span>
    </div>

    <div class="tooltip">
      <span class="icon">📘</span>
      <span class="tooltip-text">Here’s a book tooltip for learning!</span>
    </div>

    <div class="tooltip">
      <span class="icon">❤️</span>
      <span class="tooltip-text">A heart shows love or favorite.</span>
    </div>

    <div class="tooltip">
      <span class="word">Hover Me</span>
      <span class="tooltip-text">You hovered over a word!</span>
    </div>
  </div>
</body>
</html>
