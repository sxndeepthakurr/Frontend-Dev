<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile | Bootstrap Portfolio</title>

  <!-- ✅ Bootstrap CSS CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
</head>
<body class="bg-light text-dark">

  <!-- ✅ Main Container -->
  <div class="container text-center p-5">

    <!-- Header -->
    <header class="mb-4">
      <h1 class="fw-bold mb-3">John Doe</h1>
      <p class="lead">Full Stack Developer | Building Modern Web Experiences</p>
    </header>

    <!-- Profile Image -->
    <div class="mb-4">
      <img 
        src="https://via.placeholder.com/180" 
        alt="Profile Photo" 
        class="img-fluid rounded-circle border border-3 border-primary"
      >
    </div>

    <!-- Buttons -->
    <div class="mb-4">
      <a href="#" class="btn btn-primary me-3">Hire Me</a>
      <a href="#" class="btn btn-outline-secondary">Download CV</a>
    </div>

    <!-- Contact Form -->
    <section class="mt-4">
      <h3 class="fw-bold mb-3">Contact Me</h3>
      <form class="mx-auto" style="max-width: 400px;">
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Your Name" required>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control" placeholder="Your Email" required>
        </div>
        <div class="mb-3">
          <textarea class="form-control" rows="3" placeholder="Your Message"></textarea>
        </div>
        <button type="submit" class="btn btn-success w-100">Send Message</button>
      </form>
    </section>

  </div>

  <!-- ✅ Bootstrap JS Bundle -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous">
  </script>

</body>
</html>
