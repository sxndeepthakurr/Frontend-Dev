<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Startup Landing Page</title>

  <!-- ✅ Bootstrap CSS CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >

  <style>
    /* Custom Styles */
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    header {
      background-color: #004aad;
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }

    .hero {
      background: linear-gradient(to right, #004aad, #007bff);
      color: white;
      padding: 100px 0;
      text-align: center;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.25rem;
      margin-bottom: 30px;
    }

    .hero .btn-primary {
      background-color: #ffdd57;
      border: none;
      color: #004aad;
      font-weight: 600;
    }

    .hero .btn-primary:hover {
      background-color: #ffc107;
      color: #002e6d;
    }

    footer {
      background-color: #004aad;
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <!-- ✅ Header with Navbar -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand" href="#">StartupX</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- ✅ Hero Section -->
  <section class="hero">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <h1>Welcome to StartupX</h1>
          <p>Your journey to innovation begins here. We help startups grow and scale faster.</p>
          <a href="#" class="btn btn-primary btn-lg">Get Started</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ✅ Footer -->
  <footer>
    <p>&copy; 2025 StartupX. All rights reserved.</p>
  </footer>

  <!-- ✅ Bootstrap JS Bundle (for responsive navbar toggle) -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous">
  </script>

</body>
</html>
