<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | User Notifications</title>

  <!-- ✅ Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
    crossorigin="anonymous"
  >

  <style>
    body {
      background-color: #f8f9fa;
    }

    .dashboard-container {
      margin-top: 50px;
    }

    .summary-well {
      border: 1px solid #dee2e6;
      padding: 20px;
      border-radius: 8px;
      background-color: #f1f3f5;
    }
  </style>
</head>
<body>

  <div class="container dashboard-container">

    <h1 class="text-center mb-4">User Notifications</h1>

    <!-- ✅ Alerts Card -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">

        <!-- Success Alert -->
        <div class="alert alert-success" role="alert">
          ✅ You have 3 new messages.
        </div>

        <!-- Info Alert -->
        <div class="alert alert-info" role="alert">
          ℹ️ Tips: Check out your profile settings for new features.
        </div>

        <!-- Dismissible Danger Alert -->
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          ⚠️ Warning: Your subscription will expire in 3 days!
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

      </div>
    </div>

    <!-- ✅ Summary Well -->
    <div class="summary-well text-center">
      <h5>Notification Summary</h5>
      <p class="mb-1">Total Messages: 3</p>
      <p class="mb-1">Tips Available: 1</p>
      <p class="mb-0">Warnings: 1</p>
    </div>

  </div>

  <!-- ✅ Bootstrap JS Bundle -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous">
  </script>
</body>
</html>
